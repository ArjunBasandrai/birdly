[project]
name = "birdly"
version = "0.1.0"
description = "Birdly Bird Identifier"
readme = "README.md"
authors = [
    { name = "Arjun Basandrai", email = "arjunbasandrai2004@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.9",
    "dvc>=3.67.1",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "mlflow>=3.4",
    "pandas>=3.0.5",
    "pillow>=12.0",
    "polars>=1.44.1",
    "psutil>=7.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
    "structlog>=26.1.0",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "typer>=0.27.1",
]

[project.scripts]
birdly = "birdly.cli.cli:app"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
